<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codecast Workflow Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Login Modal ── -->
  <div id="login-modal" class="modal-overlay login-overlay" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <div class="login-bg-mesh">
      <div class="mesh-orb orb-1"></div>
      <div class="mesh-orb orb-2"></div>
      <div class="mesh-grid"></div>
    </div>
    
    <div class="modal-card login-card">
      <div class="login-brand-header">
        <div class="login-logo-wrapper">
          <div class="login-logo">
            <svg class="logo-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="url(#logo-grad)" stroke="#00d4e8" stroke-width="1.5" stroke-linejoin="round"/>
              <defs>
                <linearGradient id="logo-grad" x1="3" y1="2" x2="21" y2="22" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#00d4e8"/>
                  <stop offset="1" stop-color="#0066ff"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
          <div class="logo-pulse"></div>
        </div>
        <h2 id="login-title" class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Enter your credentials to access <strong>Codecast Engine</strong></p>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="form-group">
          <label for="login-username">Username or Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
              <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
            </svg>
            <input type="text" id="login-username" name="login-username" class="form-input login-input" placeholder="username" autocomplete="username" autofocus required />
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="login-password">Password</label>
          </div>
          <div class="input-wrapper">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="18" height="18">
              <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
            </svg>
            <input type="password" id="login-password" name="login-password" class="form-input login-input" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" id="toggle-pw-btn" class="toggle-pw-btn" aria-label="Show password" aria-pressed="false">
              <svg class="eye-icon eye-show" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
              </svg>
              <svg class="eye-icon eye-hide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
                <path fill-rule="evenodd" d="M3.28 2.22a.75.75 0 00-1.06 1.06l14.5 14.5a.75.75 0 101.06-1.06l-1.745-1.745a10.29 10.29 0 003.336-4.045.75.75 0 000-.63C17.912 5.943 14.212 3 10 3a9.958 9.958 0 00-4.512 1.074l-2.208-2.208zm5.294 5.294a2.5 2.5 0 013.395 3.395l-3.395-3.395z" clip-rule="evenodd" />
                <path d="M6.68 6.14L9.86 9.32a2.5 2.5 0 002.82 2.82l1.634 1.634A9.94 9.94 0 0110 15c-4.212 0-7.912-2.943-9.542-7a10.28 10.28 0 013.222-4.29l2.999 2.43z" />
              </svg>
            </button>
          </div>
        </div>

        <div id="login-error" class="login-error" role="alert">
          <svg class="login-error-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="15" height="15">
            <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495zM10 6a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 6zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
          </svg>
          <span id="login-error-text"></span>
        </div>

        <button type="submit" class="btn btn-login-submit" id="login-submit-btn">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-label">Sign In</span>
          <svg class="btn-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      </form>
    </div>
  </div>

  <div id="app-shell">
    <!-- ── Top Navigation ── -->
    <header class="app-header">
      <div class="header-brand">
        <span class="brand-badge">CODECAST</span>
        <span class="brand-name">Workflow Engine</span>
      </div>

      <div id="stats" class="stats-bar"></div>

      <div class="role-wrapper">
        <span class="role-label">Logged in as:</span>
        <span id="role-indicator" class="role-indicator">—</span>
        <button id="logout-btn" class="btn btn-ghost btn-logout" aria-label="Log out">Logout</button>
      </div>
    </header>

    <!-- ── Kanban Board ── -->
    <main class="board-wrapper">
      <div id="board" class="board" role="list" aria-label="Video production pipeline"></div>
    </main>

    <!-- ── Floating Action Button ── -->
    <button id="fab" class="fab" title="Add New Video Task" aria-label="Add New Video Task">
      <span class="fab-icon" aria-hidden="true">+</span>
    </button>
  </div>

  <!-- ── Add / Edit Modal ── -->
  <div id="modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Add New Video Task</h2>
        <button id="modal-close" class="modal-close" aria-label="Close modal">&#x2715;</button>
      </div>

      <form id="task-form" class="task-form" novalidate>
        <div class="form-group">
          <label for="task-title">Video Title <span class="required" aria-hidden="true">*</span></label>
          <input
            type="text"
            id="task-title"
            name="task-title"
            class="form-input"
            placeholder="e.g. Introduction to Spring Boot"
            required
            autocomplete="off"
          />
        </div>

        <div class="form-group">
          <label for="task-description">Description</label>
          <textarea
            id="task-description"
            name="task-description"
            class="form-input form-textarea"
            placeholder="Brief overview of the video content..."
            rows="3"
          ></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-role">Assigned Role</label>
            <select id="task-role" name="task-role" class="form-input form-select">
              <option value="Content">Content Team</option>
              <option value="Editor">Video Editor</option>
              <option value="Uploader">Uploader</option>
              <option value="Admin">Admin</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-state">Stage</label>
            <select id="task-state" name="task-state" class="form-input form-select">
              <option value="code_ready">Code &amp; Examples Ready</option>
              <option value="recorded">Recorded</option>
              <option value="editing">Editing in Progress</option>
              <option value="uploaded">Uploaded (Pending Verification)</option>
              <option value="published">Verified &amp; Published</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Toast Notification Container ── -->
  <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script src="app.js"></script>
</body>
</html>
